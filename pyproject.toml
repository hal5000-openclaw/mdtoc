[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdtoc"
version = "0.1.0"
description = "Generate and update a table of contents for Markdown files"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mdtoc = "mdtoc.cli:main"

[tool.setuptools]
packages = ["mdtoc"]
